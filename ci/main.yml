---
app: "9888"
src: "src"
domain_name: "TER"
app_name: "RDPPF"
os_type: 'windows'
product: 'iis'

artifact_repository_name: 'thirdparty'
artifact_group_id: 'ch.ge.ter'
artifact_id: "{{ app }}"
artifact_ext: 'zip'
artifact_classifier: ""
artifact_file_name: "{{ artifact_id }}-{{ version }}.{{ artifact_ext }}"

deploy_releases_folder_suffix: ''
app_log_folder: "D:\\logs\\{{ app }}"

win_iis_webapppool_name: "{{ app }}_{{ app_name }}"
win_iis_webapplication_name: 'terecadastrews'
win_iis_webapplication_site: "{{ stage|upper }}"
