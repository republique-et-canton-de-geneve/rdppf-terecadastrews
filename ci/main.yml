---
app: "9888"
src: "src"
domain_name: "TER"
app_name: "RDPPF"
os_type: 'windows'
product: 'iis'

artifact_repository_name: 'thirdparty'
artifact_group_id: 'ch.ge.ter'
artifact_id: "{{ app }}"
artifact_ext: 'zip'
artifact_classifier: ""
artifact_file_name: "{{ artifact_id }}-{{ version }}.{{ artifact_ext }}"

deploy_releases_folder_suffix: ''
app_log_folder: "D:\\logs\\{{ app }}"

timestamp: "{{ansible_date_time.year}}{{ ansible_date_time.month }}{{ ansible_date_time.day }}-{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}"
sources_folder: "D:\\_sources\\{{ app }}\\Livraisons\\{{ timestamp }}_{{ app }}_{{ app_name }}_release_{{ version }}\\"

win_iis_webapppool_name: "{{ app }}_{{ app_name }}"
win_iis_webapplication_name: 'terecadastrews'
win_iis_webapplication_site: "{{ stage|upper }}"

app_templates_dynamic: true

stages:
  dev:
    hosts: "w09635apdev04"
    ClientEnvironmentUrl: "https://appdev2.ge.ch"
    ApplicationUrl: "https://dev.etat-ge.ch"
    
  rec:
    hosts: "w09635aprec04"
    ClientEnvironmentUrl: "https://rec.etat-ge.ch"
    ApplicationUrl: "https://demo.ge.ch"

  prod:
    hosts: "w09635apprd04"
    ClientEnvironmentUrl: "https://ge.ch"

